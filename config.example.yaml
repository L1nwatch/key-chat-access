# Merge this plugin node into the existing CPA configuration.
# Replace the empty list with caller scopes generated by caller_scope.py.
plugins:
  enabled: true
  store-sources:
    - "https://raw.githubusercontent.com/L1nwatch/key-chat-access/main/registry.json"
  configs:
    key-chat-access:
      enabled: true
      priority: 1000
      blocked_caller_scopes: []
